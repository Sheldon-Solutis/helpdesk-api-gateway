spring.application.name=api-gateway

server.port=${SERVER_PORT:8080}

services.user.url=${USER_SERVICE_URL:http://localhost:8081}
services.ticket.url=${TICKET_SERVICE_URL:http://localhost:8082}
services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8083}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true